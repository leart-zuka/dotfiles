[main]
font=Iosevka Nerd Font:size=11.5
# kitty's bold/italic "auto" behavior is foot's default too —
# omitting font-bold/font-italic/font-bold-italic makes foot
# derive them automatically from the family via fontconfig
# fallback font (typo'd as font_familty in your kitty config):
# font=Iosevka Nerd Font:size=11.5,icomoon:size=11.5
selection-target=clipboard

[cursor]
style=block
blink=no
# color=cccccc cccccc
# format is "<text-color> <cursor-color>"; adjust the first value
# to whatever text color you want under a block cursor

[bell]
urgent=yes
notify=no

[csd]
size=0
# removes foot's own title bar/decorations (only matters on
# compositors without server-side decoration support, e.g. GNOME;
# under sway/river it's irrelevant since there's no CSD anyway)

[colors-dark]
alpha=0.60
background=000000
foreground=e0def4
selection-background=FFFACD

regular0=3B4252
regular1=FF789E
regular2=A3BE8C
regular3=f6c177
regular4=81A1C1
regular5=c4a7e7
regular6=9ccfd8
regular7=E5E9F0

bright0=4C566A
bright1=FF789E
bright2=A3BE8C
bright3=f6c177
bright4=81A1C1
bright5=c4a7e7
bright6=8FBCBB
bright7=ECEFF4
